# Static server for the unsafe examples demo site.
#
# Every URL maps straight to a file on disk. The pages use relative asset paths plus the
# data-root attribute, so the tree can be served from the root or from any sub path without
# rewrite rules. Directory requests resolve to index.html and keep their query string, which is
# what the OAuth consent link (oauth2/consent/?client_id=...) needs.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # The site is a public demo of attack pages. Keep it out of search indexes and stop the
  # browser from guessing content types.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
