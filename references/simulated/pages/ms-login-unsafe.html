<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simulated Test - Microsoft Login</title>
  <link rel="icon" type="image/x-icon" href="ms-favicon.ico" />
  <script src="../guard.js"></script>
  <style>
    body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: #f2f2f2; margin: 0; display: flex; flex-direction: column; align-items: center; padding-top: 4vh; }
    .sim-banner { background: #b02a1e; color: #fff; font-size: 0.85rem; padding: 0.6rem 1rem; border-radius: 6px; max-width: 360px; text-align: center; margin-bottom: 1.5rem; }
    .sim-banner a { color: #fff; }
    .card { background: #fff; width: 360px; padding: 44px 40px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 28px; color: #1b1b1b; }
    label { display: block; font-size: 13px; margin: 14px 0 4px; color: #333; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; border: 1px solid #666; border-radius: 2px; }
    button.sign-in { width: 100%; margin-top: 28px; padding: 10px; background: #0067b8; color: #fff; border: none; font-size: 15px; border-radius: 2px; cursor: pointer; }
    .sub { margin-top: 18px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="sim-banner">⚠ SIMULATED TEST - not a real login page. <a href="../index.html">Back to test list</a></div>
  <div class="card">
    <h1>Microsoft login</h1>
    <form action="#" method="post" onsubmit="event.preventDefault(); return false;">
      <label for="user">Email, phone, or Skype</label>
      <input id="user" name="loginfmt" type="text" autocomplete="username" />
      <label for="pass">Password</label>
      <input id="pass" name="passwd" type="password" autocomplete="current-password" />
      <button class="sign-in" type="submit">Sign in</button>
    </form>
    <p class="sub">Microsoft favicon - unsafe/brand-flagged fixture. Do not enter real credentials.</p>
  </div>
</body>
</html>
